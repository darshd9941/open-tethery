<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tethery">
  <meta name="format-detection" content="telephone=no">
  <title>Open Tethery</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/overlays.css">
  <link rel="stylesheet" href="/css/social.css">
  <link rel="stylesheet" href="/css/scopes.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-start" viewBox="0 0 24 24"><path d="M6 5v14M19 6v12l-9-6z"/></symbol>
      <symbol id="i-end" viewBox="0 0 24 24"><path d="M18 5v14M5 6v12l9-6z"/></symbol>
      <symbol id="i-back5" viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></symbol>
      <symbol id="i-fwd5" viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></symbol>
      <symbol id="i-back1" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6M5 6v12"/></symbol>
      <symbol id="i-fwd1" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6M19 6v12"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-speaker-off" viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 13v7h14v-7"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-frame" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M10 17.5h4"/></symbol>
      <symbol id="i-guides" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></symbol>
      <symbol id="i-scopes" viewBox="0 0 24 24"><path d="M3 18c2-9 4-9 6 0s4 9 6 0 4-9 6 0"/></symbol>
      <symbol id="i-colour" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
      <symbol id="i-zebra" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 14L14 4M4 20L20 4M10 20l10-10"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
    </defs>
  </svg>

  <div id="app" data-ui="shown" data-tray="closed" hidden>
    <header id="top">
      <div class="np">
        <span id="liveBadge" class="np-badge" role="status">IDLE</span>
        <span id="npApp" hidden></span>
        <span id="npSeq" class="np-seq">Connecting…</span>
        <span id="npTc" class="np-tc">--:--:--:--</span>
      </div>
    </header>

    <main id="stage" aria-label="Preview">
      <div id="zoom">
        <div id="pic">
          <canvas id="canvas" width="16" height="9"></canvas>
          <!-- Overlay mount point: frame-bus getStage() returns this element. -->
          <div id="overlayStage"></div>
        </div>
      </div>
      <!-- Scope widgets live here (CONTRACT.md "dock"); not zoomed. -->
      <div id="dock" class="dock"></div>
      <div id="cover" class="cover">
        <div class="cover-card">
          <div id="coverSpin" class="spinner" aria-hidden="true"></div>
          <h1 id="coverTitle">Connecting…</h1>
          <p id="coverText"></p>
        </div>
      </div>
      <div id="banner" class="banner" hidden></div>
    </main>

    <!-- Overlay settings: bottom tray in portrait, side panel in landscape. js/overlays/index.js fills it. -->
    <section id="tray" class="tray" aria-label="Overlay settings" hidden></section>

    <footer id="bottom">
      <div id="hint" class="hint" role="note" hidden>
        <span>Tap the picture for controls · Overlays chips below</span>
        <button id="hintClose" type="button" aria-label="Dismiss tip"><svg><use href="#i-x"/></svg></button>
      </div>
      <nav id="chips" class="chips-row" aria-label="Overlays"></nav>

      <section id="transport" aria-label="Playback">
        <div class="scrub-row">
          <span id="scrubCur" class="scrub-time">0:00</span>
          <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Position">
          <span id="scrubDur" class="scrub-time">0:00</span>
        </div>
        <div class="tp-row">
          <button id="tpStart" class="tp" type="button" aria-label="Jump to start"><svg><use href="#i-start"/></svg></button>
          <button id="tpBack5" class="tp" type="button" aria-label="Back 5 seconds"><svg><use href="#i-back5"/></svg><small>5s</small></button>
          <button id="tpBack1" class="tp" type="button" aria-label="Back one frame"><svg><use href="#i-back1"/></svg><small>1f</small></button>
          <button id="tpPlay" class="tp main" type="button" aria-label="Play"><svg><use id="tpPlayIcon" href="#i-play"/></svg></button>
          <button id="tpFwd1" class="tp" type="button" aria-label="Forward one frame"><svg><use href="#i-fwd1"/></svg><small>1f</small></button>
          <button id="tpFwd5" class="tp" type="button" aria-label="Forward 5 seconds"><svg><use href="#i-fwd5"/></svg><small>5s</small></button>
          <button id="tpEnd" class="tp" type="button" aria-label="Jump to end"><svg><use href="#i-end"/></svg></button>
        </div>
        <p id="tpNote" class="note" hidden></p>
      </section>

      <section id="soundRow" class="sound-row" hidden>
        <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label>Sync <input id="sync" type="range" min="-300" max="300" step="10" value="0"><output id="syncOut">0 ms</output></label>
      </section>

      <nav id="actions" aria-label="Tools">
        <button id="btnSound" class="act" type="button" aria-pressed="false"><svg><use id="soundIcon" href="#i-speaker-off"/></svg><span id="soundLabel">Sound</span></button>
        <button id="btnStats" class="act" type="button"><svg><use href="#i-chart"/></svg><span>Stats</span></button>
        <button id="btnSave" class="act" type="button"><svg><use href="#i-save"/></svg><span>Save frame</span></button>
        <button id="btnShare" class="act" type="button"><svg><use href="#i-share"/></svg><span>Share</span></button>
        <button id="btnFull" class="act" type="button"><svg><use href="#i-full"/></svg><span>Full screen</span></button>
      </nav>
    </footer>
  </div>

  <section id="entry" class="entry" hidden>
    <div class="entry-card">
      <img src="/icon-192.png" class="entry-logo" alt="" width="64" height="64">
      <h1>Open Tethery</h1>
      <p class="entry-lead">Type the 4-character code shown on your PC.</p>
      <div id="codeBoxes" class="code-boxes" role="group" aria-label="Session code">
        <input class="code-box" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Character 1">
        <input class="code-box" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Character 2">
        <input class="code-box" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Character 3">
        <input class="code-box" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Character 4">
      </div>
      <p id="entryError" class="entry-error" role="alert" hidden></p>
      <button id="entryGo" class="primary" type="button" disabled>Connect</button>
      <p class="entry-hint">You can also scan the QR code in the Open Tethery panel. Phone and PC must be on the same Wi-Fi.</p>
    </div>
  </section>

  <div id="sheetStats" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="Stats">
      <div class="sheet-head"><h2>Stats</h2><button class="sheet-close" type="button" data-close aria-label="Close">Done</button></div>
      <dl id="statsList" class="stats"></dl>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
