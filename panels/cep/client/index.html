<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Tethery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header class="top">
      <h1>Open Tethery</h1>
      <span id="pill" class="pill idle">IDLE</span>
    </header>

    <section id="helperCard" class="card warn" hidden>
      <h2>Helper not running</h2>
      <p id="helperText">Open Tethery needs its small helper program to talk to phones.</p>
      <button id="startHelperBtn" class="btn primary">Start helper</button>
    </section>

    <section id="engineCard" class="card warn" hidden>
      <h2 id="engineTitle"></h2>
      <p id="engineBody"></p>
      <p class="steps" id="engineSteps"></p>
      <button id="recheckBtn" class="btn">Check again</button>
    </section>

    <section id="pairing" class="pairing">
      <div class="qr"><img id="qr" alt="QR code to open the live preview on your phone" width="200" height="200"></div>
      <div id="code" class="code" aria-label="Session code">----</div>
      <div class="url-row">
        <span id="url" class="url" title=""></span>
        <button id="copyBtn" class="btn small">Copy</button>
      </div>
      <button id="newCodeBtn" class="btn small ghost">New code</button>
    </section>

    <section class="seq">
      <div id="seqName" class="seq-name">No sequence</div>
      <div id="seqInfo" class="seq-info"></div>
      <div id="hostApp" class="seq-host"></div>
    </section>

    <section class="phones">
      <h2>Phones connected: <span id="phoneCount">0</span></h2>
      <ul id="phoneList" class="phone-list"></ul>
      <label class="switch-row">
        <span>Allow control from phones</span>
        <input type="checkbox" id="allowControl" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <footer class="stats" id="stats">&nbsp;</footer>
  </main>

  <script src="lib/CSInterface.js"></script>
  <script src="js/state-format.js"></script>
  <script src="js/control-bridge.js"></script>
  <script src="js/panel-client.js"></script>
  <script src="js/helper-launcher.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
