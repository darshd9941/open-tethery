<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Preview - Pair your phone</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#16181d; --muted:#5d6472; --line:#dfe2e8; --ok:#1a9d54; --warn:#c77d0a; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#eceef2; --muted:#9aa2b1; --line:#2d323b; --ok:#3ecf7e; --warn:#e8a73a; --bad:#ec6a5c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:20px;
         padding:32px 28px; text-align:center; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  #qr { width:min(360px,100%); aspect-ratio:1; margin:0 auto 16px; background:#fff; border-radius:12px; padding:12px;
        display:flex; align-items:center; justify-content:center; color:#555; }
  #qr svg { width:100%; height:100%; display:block; }
  #link { word-break:break-all; font:13px ui-monospace,Consolas,monospace; color:var(--muted); margin:0 0 6px; user-select:all; }
  button { font:inherit; font-size:14px; color:var(--text); background:transparent; border:1px solid var(--line);
           border-radius:8px; padding:6px 14px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  .status { margin-top:24px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  .small { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Watch Premiere on your phone</h1>
  <p class="sub">Point your phone camera at this code. Your phone must be on the same Wi-Fi as this PC.</p>
  <div id="qr">Waiting for Premiere...</div>
  <p id="link"></p>
  <button id="copy" hidden>Copy link</button>
  <div class="status">
    <div class="row"><span id="dot" class="dot"></span><span id="state">Connecting...</span></div>
    <div class="small" id="viewers"></div>
  </div>
</main>
<script src="/host-qr.js"></script>
<script>
(function () {
  var qrBox = document.getElementById('qr'), linkEl = document.getElementById('link');
  var dot = document.getElementById('dot'), stateEl = document.getElementById('state');
  var viewersEl = document.getElementById('viewers'), copyBtn = document.getElementById('copy');
  var shown = null;

  function drawQr(url) {
    try {
      var q = qrcode(0, 'M'); q.addData(url); q.make();
      qrBox.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { qrBox.textContent = 'Could not draw the code. Use the link below.'; }
  }

  function render(info) {
    var tx = info.transmit || {};
    var online = !!info.pluginOnline;
    var url = info.pairUrl || null;
    if (url !== shown) {
      shown = url;
      if (url) { drawQr(url); linkEl.textContent = url; copyBtn.hidden = false; }
      else { qrBox.textContent = 'Waiting for Premiere to start a preview...'; linkEl.textContent = ''; copyBtn.hidden = true; }
    }
    if (online) {
      var bits = ['Premiere connected'];
      if (tx.playing) bits.push('playing'); else bits.push('paused');
      if (tx.playing && tx.fps) bits.push(Math.round(tx.fps) + ' fps');
      stateEl.textContent = bits.join(' \u00b7 ');
      dot.className = 'dot ' + (tx.playing ? 'ok' : 'warn');
    } else {
      stateEl.textContent = 'Premiere not connected yet';
      dot.className = 'dot';
    }
    var n = info.viewers || 0;
    viewersEl.textContent = n === 0 ? 'No phones watching yet' : n === 1 ? '1 phone watching' : n + ' phones watching';
  }

  function poll() {
    fetch('/info', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(render)
      .catch(function () { stateEl.textContent = 'Lost contact with the preview program'; dot.className = 'dot'; });
  }
  copyBtn.onclick = function () {
    if (!shown) return;
    (navigator.clipboard ? navigator.clipboard.writeText(shown) : Promise.reject()).then(function () {
      copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy link'; }, 1500);
    }, function () {});
  };
  poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
